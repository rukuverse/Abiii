<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abiii</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX Compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root { --line:#242424; --panel:#0b0b0b; --muted:#777; }
        * { box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body {
            margin:0; background:
            radial-gradient(circle at 50% -10%,rgba(255,255,255,.055),transparent 34%),#000;
            color:#fff; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        }
        button,input,textarea,select { font:inherit; }
        button { -webkit-tap-highlight-color:transparent; }
        ::selection { background:#fff;color:#000; }
        .custom-scrollbar::-webkit-scrollbar{width:5px;height:5px}
        .custom-scrollbar::-webkit-scrollbar-track{background:#080808}
        .custom-scrollbar::-webkit-scrollbar-thumb{background:#2d2d2d;border-radius:999px}

        .editorial-shell{position:relative;isolation:isolate;min-height:100vh}
        .editorial-shell:before{
            content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.22;
            background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
            background-size:48px 48px;mask-image:linear-gradient(to bottom,#000,transparent 88%);
        }
        .editorial-shell:after{
            content:"";position:fixed;inset:0;pointer-events:none;z-index:20;opacity:.025;
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
        }
        .editorial-header{background:rgba(0,0,0,.88)!important;border-color:#1d1d1d!important;box-shadow:0 12px 45px rgba(0,0,0,.28)}
        .brand-mark{border-radius:12px!important;width:42px!important;height:42px!important;box-shadow:0 0 0 1px rgba(255,255,255,.15),0 12px 35px rgba(255,255,255,.07)!important}
        .editorial-nav{background:rgba(7,7,7,.86)!important;border-color:#1a1a1a!important;position:sticky;top:75px;z-index:25}
        .editorial-nav button{position:relative;letter-spacing:.12em!important;transition:color .2s,transform .2s}
        .editorial-nav button:hover{transform:translateY(-1px)}
        .editorial-main{max-width:1440px!important;padding-top:34px!important;padding-bottom:70px!important}
        .section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;border-bottom:1px solid #1f1f1f;padding-bottom:14px}
        .editorial-card{
            position:relative;overflow:hidden;border-radius:20px!important;
            background:linear-gradient(145deg,rgba(20,20,20,.72),rgba(7,7,7,.78))!important;
            border-color:#222!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 18px 55px rgba(0,0,0,.12);
            transition:transform .22s,border-color .22s,background .22s
        }
        .editorial-card:hover{transform:translateY(-2px);border-color:#333!important}
        .stat-card{min-height:142px;display:flex;flex-direction:column;justify-content:space-between}
        .editorial-action{border-radius:14px!important;background:#0d0d0d!important;border-color:#242424!important;transition:transform .2s,background .2s,border-color .2s}
        .editorial-action:hover{transform:translateX(4px);background:#151515!important;border-color:#3a3a3a!important}
        .mono-label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.12em}
        .search-bar{background:rgba(8,8,8,.9);border:1px solid #252525;border-radius:14px;transition:border-color .2s}
        .search-bar:focus-within{border-color:#555;box-shadow:0 0 0 3px rgba(255,255,255,.035)}
        .toast{
            position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:100;
            padding:11px 15px;border:1px solid #333;border-radius:12px;background:#111;color:#fff;
            font:700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:0 18px 55px rgba(0,0,0,.5);
            transition:opacity .22s,transform .22s
        }
        .toast.show{opacity:1;transform:translate(-50%,0)}
        .modal-panel{background:rgba(13,13,13,.97)!important;border-color:#2a2a2a!important;box-shadow:0 30px 100px rgba(0,0,0,.65)}
        .field{width:100%;background:#090909;border:1px solid #252525;color:#fff;padding:.75rem .85rem;border-radius:.8rem;font-size:.875rem;outline:none}
        .field:focus{border-color:#777;box-shadow:0 0 0 3px rgba(255,255,255,.04)}
        .field::placeholder{color:#555}
    </style>
</head>
<body class="bg-black text-white antialiased selection:bg-white selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
        function AbiiApp() {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [toast, setToast] = React.useState('');
            const [showShortcuts, setShowShortcuts] = React.useState(false);
            const [editingTopic, setEditingTopic] = React.useState(null);
            const [editingPractice, setEditingPractice] = React.useState(null);
            const [editingExam, setEditingExam] = React.useState(null);
            const [editingLog, setEditingLog] = React.useState(null);
            const [calendarMonth, setCalendarMonth] = React.useState(new Date());
            
            // Persistent Local Storage Handlers (Preserves all entries across refresh)
            const [topics, setTopics] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('abiii_topics');
                    if (saved) return JSON.parse(saved);
                } catch(e) {}
                return [
                    { id: 1, subject: 'Physics', title: 'Quantum Mechanics Basics', startPage: 12, endPage: 45, status: 'Reading', confidence: 'Hazy', targetDate: '2026-11-10', nextReview: '2026-11-08', notes: 'Review wave-particle duality equations.' },
                    { id: 2, subject: 'Mathematics', title: 'Multivariable Calculus', startPage: 104, endPage: 132, status: 'Done', confidence: 'Solid', targetDate: '2026-11-15', nextReview: '2026-11-12', notes: 'Lagrange multipliers practice sets.' }
                ];
            });

            const [practiceSets, setPracticeSets] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('abiii_practice');
                    if (saved) return JSON.parse(saved);
                } catch(e) {}
                return [
                    { id: 1, subject: 'Physics', title: 'Electromagnetism Set 1', mode: 'Hardcore Grind', totalQ: 25, correctQ: 21, timeMin: 45, date: '2026-11-05', mistakes: 'Right-hand rule confusion in solenoid problems.' }
                ];
            });

            const [exams, setExams] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('abiii_exams');
                    if (saved) return JSON.parse(saved);
                } catch(e) {}
                return [
                    { id: 1, title: 'Midterm Board Exam', date: '2026-11-25', syllabus: 'Units 1 to 4 Complete' }
                ];
            });

            const [focusLogs, setFocusLogs] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('abiii_focus_logs');
                    if (saved) return JSON.parse(saved);
                } catch(e) {}
                return [
                    { id: 1, subject: 'Physics', durationMin: 25, mode: 'Breezy Glance', date: '2026-11-05' }
                ];
            });

            const [timerActive, setTimerActive] = React.useState(false);
            const [timerMinutes, setTimerMinutes] = React.useState(25);
            const [timeLeft, setTimeLeft] = React.useState(25 * 60);
            const [studyMode, setStudyMode] = React.useState('Breezy Glance');
            const [timerSubject, setTimerSubject] = React.useState('General');

            const [showTopicModal, setShowTopicModal] = React.useState(false);
            const [newTopic, setNewTopic] = React.useState({ subject: '', title: '', startPage: '', endPage: '', targetDate: '', notes: '' });

            const [showPracticeModal, setShowPracticeModal] = React.useState(false);
            const [newPractice, setNewPractice] = React.useState({ subject: '', title: '', mode: 'Breezy Glance', totalQ: '', correctQ: '', timeMin: '', mistakes: '' });

            const [showExamModal, setShowExamModal] = React.useState(false);
            const [newExam, setNewExam] = React.useState({ title: '', date: '', syllabus: '' });

            // Automatically sync state to LocalStorage
            React.useEffect(() => {
                try {
                    localStorage.setItem('abiii_topics', JSON.stringify(topics));
                    localStorage.setItem('abiii_practice', JSON.stringify(practiceSets));
                    localStorage.setItem('abiii_exams', JSON.stringify(exams));
                    localStorage.setItem('abiii_focus_logs', JSON.stringify(focusLogs));
                } catch(e) {}
            }, [topics, practiceSets, exams, focusLogs]);

            React.useEffect(() => {
                let interval = null;
                if (timerActive && timeLeft > 0) {
                    interval = setInterval(() => setTimeLeft(t => t - 1), 1000);
                } else if (timeLeft === 0 && timerActive) {
                    setTimerActive(false);
                    completeFocusSession();
                }
                return () => clearInterval(interval);
            }, [timerActive, timeLeft]);

            const completeFocusSession = () => {
                const log = {
                    id: Date.now(),
                    subject: timerSubject || 'General',
                    durationMin: timerMinutes,
                    mode: studyMode,
                    date: new Date().toISOString().split('T')[0]
                };
                setTimerActive(false);
                setFocusLogs(prev => [log, ...prev]);
                showToast(`${timerMinutes} min ${studyMode} session logged · ${log.subject}`);
                setTimeLeft(timerMinutes * 60);
            };

            const handleAddTopic = (e) => {
                e.preventDefault();
                if (!newTopic.title) return;
                setTopics([...topics, {
                    id: Date.now(),
                    ...newTopic,
                    status: 'Unread',
                    confidence: 'Forgot',
                    nextReview: newTopic.targetDate || new Date().toISOString().split('T')[0]
                }]);
                setNewTopic({ subject: '', title: '', startPage: '', endPage: '', targetDate: '', notes: '' });
                setShowTopicModal(false);
                showToast('Chapter logged');
            };

            const handleAddPractice = (e) => {
                e.preventDefault();
                if (!newPractice.title) return;
                setPracticeSets([...practiceSets, {
                    id: Date.now(),
                    ...newPractice,
                    date: new Date().toISOString().split('T')[0]
                }]);
                setNewPractice({ subject: '', title: '', mode: 'Breezy Glance', totalQ: '', correctQ: '', timeMin: '', mistakes: '' });
                setShowPracticeModal(false);
                showToast('Practice set logged');
            };

            const handleAddExam = (e) => {
                e.preventDefault();
                if (!newExam.title) return;
                setExams([...exams, { id: Date.now(), ...newExam }]);
                setNewExam({ title: '', date: '', syllabus: '' });
                setShowExamModal(false);
                showToast('Exam scheduled');
            };

            // Edit & Delete handlers for Topics / Chapters
            const openEditTopic = (topic) => setEditingTopic({...topic});
            const saveEditedTopic = (e) => {
                e.preventDefault();
                if (!editingTopic?.title?.trim()) return;
                setTopics(prev => prev.map(t => t.id === editingTopic.id ? {...t, ...editingTopic} : t));
                setEditingTopic(null);
                showToast('Chapter updated');
            };
            const deleteTopic = (id) => {
                if (!window.confirm('Delete this chapter?')) return;
                setTopics(prev => prev.filter(t => t.id !== id));
                showToast('Chapter deleted');
            };

            // Edit & Delete handlers for Practice Sets
            const openEditPractice = (set) => setEditingPractice({...set});
            const saveEditedPractice = (e) => {
                e.preventDefault();
                if (!editingPractice?.title?.trim()) return;
                setPracticeSets(prev => prev.map(s => s.id === editingPractice.id ? {...s, ...editingPractice} : s));
                setEditingPractice(null);
                showToast('Practice set updated');
            };
            const deletePractice = (id) => {
                if (!window.confirm('Delete this practice set?')) return;
                setPracticeSets(prev => prev.filter(s => s.id !== id));
                showToast('Practice set deleted');
            };

            // Edit & Delete handlers for Exams
            const openEditExam = (exam) => setEditingExam({...exam});
            const saveEditedExam = (e) => {
                e.preventDefault();
                if (!editingExam?.title?.trim()) return;
                setExams(prev => prev.map(x => x.id === editingExam.id ? {...x, ...editingExam} : x));
                setEditingExam(null);
                showToast('Exam updated');
            };
            const deleteExam = (id) => {
                if (!window.confirm('Delete this exam?')) return;
                setExams(prev => prev.filter(x => x.id !== id));
                showToast('Exam deleted');
            };

            // Edit & Delete handlers for Focus Logs
            const openEditLog = (log) => setEditingLog({...log});
            const saveEditedLog = (e) => {
                e.preventDefault();
                if (!editingLog?.subject?.trim()) return;
                setFocusLogs(prev => prev.map(x => x.id === editingLog.id ? {...x, ...editingLog} : x));
                setEditingLog(null);
                showToast('Focus log updated');
            };
            const deleteLog = (id) => {
                if (!window.confirm('Delete this focus log?')) return;
                setFocusLogs(prev => prev.filter(x => x.id !== id));
                showToast('Focus log deleted');
            };

            const updateConfidence = (id, confidence) => {
                setTopics(topics.map(t => {
                    if (t.id === id) {
                        const daysToAdd = confidence === 'Solid' ? 7 : confidence === 'Hazy' ? 3 : 1;
                        const next = new Date();
                        next.setDate(next.getDate() + daysToAdd);
                        return { ...t, confidence, status: 'Under Revision', nextReview: next.toISOString().split('T')[0] };
                    }
                    return t;
                }));
            };

            const changeTimerDuration = (mins) => {
                setTimerActive(false);
                setTimerMinutes(mins);
                setTimeLeft(mins * 60);
            };

            const totalFocusHours = (focusLogs.reduce((acc, curr) => acc + (curr.durationMin || 0), 0) / 60).toFixed(1);

            const exportData = () => {
                const data = { topics, practiceSets, exams, focusLogs };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'abiii_study_backup.json';
                a.click();
            };

            const importData = (event) => {
                const file = event.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (Array.isArray(data.topics)) setTopics(data.topics);
                        if (Array.isArray(data.practiceSets)) setPracticeSets(data.practiceSets);
                        if (Array.isArray(data.exams)) setExams(data.exams);
                        if (Array.isArray(data.focusLogs)) setFocusLogs(data.focusLogs);
                        showToast('Backup restored successfully');
                    } catch (err) { showToast('Invalid backup file'); }
                };
                reader.readAsText(file);
                event.target.value = '';
            };

            const showToast = (message) => {
                setToast(message);
                clearTimeout(window.__abiiiToast);
                window.__abiiiToast = setTimeout(() => setToast(''), 2200);
            };

            const formatDate = (iso) => {
                if (!iso) return '—';
                return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', {day:'2-digit',month:'short',year:'numeric'});
            };

            const filteredTopics = topics.filter(t =>
                !searchQuery.trim() || `${t.subject} ${t.title} ${t.notes||''}`.toLowerCase().includes(searchQuery.toLowerCase())
            );

            const filteredPracticeSets = practiceSets.filter(s =>
                !searchQuery.trim() || `${s.subject} ${s.title} ${s.mode} ${s.mistakes||''}`.toLowerCase().includes(searchQuery.toLowerCase())
            );

            const calendarDays = React.useMemo(() => {
                const days = [];
                const today = new Date();
                for (let i = 0; i < 14; i++) {
                    const d = new Date(today);
                    d.setDate(today.getDate() + i);
                    const iso = d.toISOString().split('T')[0];
                    const scheduledTopics = topics.filter(t => t.nextReview === iso || t.targetDate === iso);
                    const scheduledExams = exams.filter(e => e.date === iso);
                    const dayFocusMins = focusLogs.filter(f => f.date === iso).reduce((acc, f) => acc + f.durationMin, 0);
                    days.push({
                        dateStr: iso,
                        dayNum: d.getDate(),
                        dayName: d.toLocaleDateString('en-US', { weekday: 'short' }),
                        isToday: i === 0,
                        topics: scheduledTopics,
                        exams: scheduledExams,
                        focusMins: dayFocusMins
                    });
                }
                return days;
            }, [topics, exams, focusLogs]);

            return (
                <div className="min-h-screen bg-black text-neutral-100 flex flex-col font-sans selection:bg-white selection:text-black editorial-shell">
                    {/* Header */}
                    <header className="border-b border-neutral-900 px-6 py-5 flex items-center justify-between bg-black/90 backdrop-blur-md sticky top-0 z-30 editorial-header">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-2xl bg-white text-black font-black flex items-center justify-center text-xl tracking-tighter shadow-[0_0_20px_rgba(255,255,255,0.15)] brand-mark">L</div>
                            <div>
                                <h1 className="text-xl md:text-2xl font-black tracking-tighter">Abiii</h1>
                                <p className="text-[10px] md:text-xs font-mono uppercase tracking-widest text-neutral-500">Offline Planner & Tracker</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={exportData} className="hidden sm:inline-flex border border-neutral-800 hover:border-neutral-700 bg-neutral-950 text-neutral-300 text-xs font-mono font-semibold px-3 py-2.5 rounded-xl transition active:scale-95">
                                Export
                            </button>
                            <label className="hidden sm:inline-flex border border-neutral-800 hover:border-neutral-700 bg-neutral-950 text-neutral-300 text-xs font-mono font-semibold px-3 py-2.5 rounded-xl transition cursor-pointer">
                                Import
                                <input type="file" accept=".json,application/json" onChange={importData} className="hidden" />
                            </label>
                            <button onClick={() => setShowTopicModal(true)} className="bg-white text-black text-xs md:text-sm font-bold px-4 py-2.5 rounded-xl hover:bg-neutral-200 transition shadow-sm active:scale-95">
                                + Log Topic
                            </button>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <nav className="border-b border-neutral-900 px-6 flex gap-3 overflow-x-auto bg-neutral-950/80 backdrop-blur custom-scrollbar editorial-nav">
                        {[
                            { id: 'dashboard', label: 'Dashboard' },
                            { id: 'queue', label: 'Today Queue' },
                            { id: 'planner', label: 'Textbooks' },
                            { id: 'practice', label: 'Practice Sets' },
                            { id: 'timer', label: 'Focus Tracker' },
                            { id: 'calendar', label: 'Calendar & Exams' }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`px-4 py-3.5 text-xs md:text-sm font-mono uppercase tracking-wider border-b-2 whitespace-nowrap transition ${activeTab === tab.id ? 'border-white text-white font-bold' : 'border-transparent text-neutral-500 hover:text-neutral-300'}`}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </nav>

                    {/* Main Content Area */}
                    <main className="flex-1 p-6 md:p-8 max-w-7xl w-full mx-auto editorial-main">
                        <div className="mb-7 flex flex-col sm:flex-row gap-3 items-stretch sm:items-center">
                            <div className="search-bar flex-1 flex items-center gap-3 px-4 py-3">
                                <span className="text-neutral-600 font-mono text-xs">/</span>
                                <input value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                                    placeholder="Search chapters, practice sets, notes…" className="w-full bg-transparent border-0 outline-none text-sm text-white placeholder:text-neutral-600" />
                                {searchQuery && <button onClick={() => setSearchQuery('')} className="text-neutral-500 hover:text-white text-xs font-mono">CLEAR</button>}
                            </div>
                        </div>

                        {activeTab === 'dashboard' && (
                            <div className="space-y-8">
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="p-6 rounded-3xl bg-neutral-900/30 border border-neutral-800/80 backdrop-blur-md editorial-card stat-card">
                                        <div className="text-[10px] font-mono text-neutral-400 uppercase tracking-widest font-semibold">Total Focus Time</div>
                                        <div className="text-4xl md:text-5xl font-black mt-2 tracking-tighter text-white">{totalFocusHours}<span className="text-sm font-mono font-normal text-neutral-400"> hrs</span></div>
                                    </div>
                                    <div className="p-6 rounded-3xl bg-neutral-900/30 border border-neutral-800/80 backdrop-blur-md editorial-card stat-card">
                                        <div className="text-[10px] font-mono text-neutral-400 uppercase tracking-widest font-semibold">Total Chapters</div>
                                        <div className="text-4xl md:text-5xl font-black mt-2 tracking-tighter">{topics.length}</div>
                                    </div>
                                    <div className="p-6 rounded-3xl bg-neutral-900/30 border border-neutral-800/80 backdrop-blur-md editorial-card stat-card">
                                        <div className="text-[10px] font-mono text-neutral-400 uppercase tracking-widest font-semibold">Solid Mastery</div>
                                        <div className="text-4xl md:text-5xl font-black mt-2 tracking-tighter text-emerald-400">{topics.filter(t => t.confidence === 'Solid').length}</div>
                                    </div>
                                    <div className="p-6 rounded-3xl bg-neutral-900/30 border border-neutral-800/80 backdrop-blur-md editorial-card stat-card">
                                        <div className="text-[10px] font-mono text-neutral-400 uppercase tracking-widest font-semibold">Practice Sets</div>
                                        <div className="text-4xl md:text-5xl font-black mt-2 tracking-tighter">{practiceSets.length}</div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="p-6 rounded-3xl bg-neutral-900/30 border border-neutral-800/80 space-y-4 editorial-card">
                                        <h3 className="text-lg font-black uppercase tracking-tight">Quick Actions</h3>
                                        <div className="flex flex-col gap-3">
                                            <button onClick={() => setShowTopicModal(true)} className="w-full text-left p-4 rounded-2xl bg-neutral-900/60 hover:bg-neutral-800/60 transition border border-neutral-800/80 flex justify-between items-center group editorial-action">
                                                <span className="font-semibold text-sm">Log Offline Textbook Chapter</span>
                                                <span className="text-neutral-500 group-hover:text-white transition">→</span>
                                            </button>
                                            <button onClick={() => setShowPracticeModal(true)} className="w-full text-left p-4 rounded-2xl bg-neutral-900/60 hover:bg-neutral-800/60 transition border border-neutral-800/80 flex justify-between items-center group editorial-action">
                                                <span className="font-semibold text-sm">Record Practice Session</span>
                                                <span className="text-neutral-500 group-hover:text-white transition">→</span>
                                            </button>
                                            <button onClick={() => setActiveTab('timer')} className="w-full text-left p-4 rounded-2xl bg-neutral-900/60 hover:bg-neutral-800/60 transition border border-neutral-800/80 flex justify-between items-center group editorial-action">
                                                <span className="font-semibold text-sm">Start Focus Session</span>
                                                <span className="text-neutral-500 group-hover:text-white transition">→</span>
                                            </button>
                                        </div>
                                    </div>

                                    <div className="p-6 rounded-3xl bg-neutral-900/30 border border-neutral-800/80 editorial-card">
                                        <h3 className="text-lg font-black uppercase tracking-tight mb-4">Exam Deadlines</h3>
                                        {exams.length === 0 ? (
                                            <p className="text-neutral-500 text-sm font-mono">No exams scheduled yet.</p>
                                        ) : (
                                            <div className="space-y-3">
                                                {exams.map(exam => (
                                                    <div key={exam.id} className="p-3.5 rounded-2xl bg-neutral-950/80 border border-neutral-800/80 flex justify-between items-center">
                                                        <div>
                                                            <div className="font-bold text-sm">{exam.title}</div>
                                                            <div className="text-xs text-neutral-400 mt-0.5">{exam.syllabus}</div>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-xs font-mono px-3 py-1 bg-white text-black rounded-lg font-black">{formatDate(exam.date)}</span>
                                                            <button onClick={() => openEditExam(exam)} className="text-[10px] font-mono px-2 py-1 rounded bg-neutral-800 text-neutral-300">Edit</button>
                                                            <button onClick={() => deleteExam(exam.id)} className="text-[10px] font-mono px-2 py-1 rounded bg-neutral-950 text-neutral-500 hover:text-white">×</button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'queue' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-black uppercase tracking-tight">Today Revision Queue</h2>
                                <div className="space-y-4">
                                    {filteredTopics.map(topic => (
                                        <div key={topic.id} className="p-6 rounded-3xl bg-neutral-900/30 border border-neutral-800/80 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                            <div>
                                                <div className="flex items-center gap-2 mb-2">
                                                    <span className="text-[10px] font-mono uppercase tracking-widest px-2.5 py-0.5 rounded-md bg-neutral-800 text-neutral-300 font-semibold">{topic.subject}</span>
                                                    <span className={`text-[10px] font-mono uppercase px-2.5 py-0.5 rounded-md font-extrabold ${
                                                        topic.confidence === 'Solid' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' :
                                                        topic.confidence === 'Hazy' ? 'bg-amber-950 text-amber-400 border border-amber-800' :
                                                        'bg-rose-950 text-rose-400 border border-rose-800'
                                                    }`}>{topic.confidence}</span>
                                                </div>
                                                <h3 className="text-lg font-bold">{topic.title}</h3>
                                                <p className="text-xs text-neutral-400 mt-1">Pages {topic.startPage}–{topic.endPage} • Target {formatDate(topic.targetDate)}</p>
                                            </div>
                                            <div className="flex items-center gap-2 w-full md:w-auto">
                                                <button onClick={() => updateConfidence(topic.id, 'Forgot')} className="flex-1 md:flex-none px-4 py-2.5 rounded-xl bg-rose-950/60 hover:bg-rose-900 border border-rose-800/80 text-rose-300 text-xs font-mono font-bold transition">Forgot</button>
                                                <button onClick={() => updateConfidence(topic.id, 'Hazy')} className="flex-1 md:flex-none px-4 py-2.5 rounded-xl bg-amber-950/60 hover:bg-amber-900 border border-amber-800/80 text-amber-300 text-xs font-mono font-bold transition">Hazy</button>
                                                <button onClick={() => updateConfidence(topic.id, 'Solid')} className="flex-1 md:flex-none px-4 py-2.5 rounded-xl bg-emerald-950/60 hover:bg-emerald-900 border border-emerald-800/80 text-emerald-300 text-xs font-mono font-bold transition">Solid</button>
                                                <button onClick={() => openEditTopic(topic)} className="px-3 py-2.5 rounded-xl bg-neutral-800 text-neutral-300 text-xs font-mono">Edit</button>
                                                <button onClick={() => deleteTopic(topic.id)} className="px-3 py-2.5 rounded-xl bg-neutral-950 text-neutral-500 hover:text-white text-xs font-mono">×</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'planner' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-black uppercase tracking-tight">Textbook Chapters</h2>
                                    <button onClick={() => setShowTopicModal(true)} className="bg-white text-black font-bold px-4 py-2 rounded-xl text-sm">+ Add Chapter</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {filteredTopics.map(topic => (
                                        <div key={topic.id} className="p-6 rounded-3xl bg-neutral-900/30 border border-neutral-800/80 space-y-3 editorial-card">
                                            <div className="flex justify-between items-start">
                                                <span className="text-xs font-mono px-2.5 py-0.5 rounded-md bg-neutral-800 text-neutral-300 font-semibold">{topic.subject}</span>
                                                <span className="text-xs font-mono text-neutral-500">Next: {formatDate(topic.nextReview)}</span>
                                            </div>
                                            <h3 className="font-bold text-lg">{topic.title}</h3>
                                            <p className="text-xs text-neutral-400 font-mono">Pages {topic.startPage} to {topic.endPage}</p>
                                            {topic.notes && <p className="text-xs bg-neutral-950 p-3 rounded-xl border border-neutral-800/80 text-neutral-300">{topic.notes}</p>}
                                            <div className="flex gap-2 pt-2">
                                                <button onClick={() => openEditTopic(topic)} className="text-xs font-mono px-3 py-1.5 rounded-lg bg-neutral-800 hover:bg-neutral-700">Edit</button>
                                                <button onClick={() => deleteTopic(topic.id)} className="text-xs font-mono px-3 py-1.5 rounded-lg bg-neutral-950 text-neutral-500 hover:text-white">Delete</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'practice' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-black uppercase tracking-tight">Practice Sets</h2>
                                    <button onClick={() => setShowPracticeModal(true)} className="bg-white text-black font-bold px-4 py-2 rounded-xl text-sm">+ Log Practice</button>
                                </div>
                                <div className="space-y-4">
                                    {filteredPracticeSets.map(set => (
                                        <div key={set.id} className="p-6 rounded-3xl bg-neutral-900/30 border border-neutral-800/80 space-y-3 editorial-card">
                                            <div className="flex justify-between items-center">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-xs font-mono px-2.5 py-0.5 rounded-md bg-neutral-800 text-neutral-300 font-semibold">{set.subject}</span>
                                                    <span className="text-xs font-mono px-2.5 py-0.5 rounded-md bg-neutral-800 text-neutral-400">{set.mode}</span>
                                                </div>
                                                <span className="text-xs font-mono text-neutral-500">{formatDate(set.date)}</span>
                                            </div>
                                            <div className="flex justify-between items-baseline">
                                                <h3 className="font-bold text-lg">{set.title}</h3>
                                                <div className="text-right font-mono text-sm">
                                                    <span className="font-extrabold text-white">{set.correctQ}</span> / {set.totalQ} correct ({Math.round((set.correctQ / (set.totalQ || 1)) * 100)}%)
                                                </div>
                                            </div>
                                            {set.mistakes && (
                                                <div className="p-3 rounded-xl bg-neutral-950 border border-neutral-800/80 text-xs text-neutral-300">
                                                    <strong className="text-white block mb-1 font-mono uppercase text-[10px]">Mistake Log:</strong> {set.mistakes}
                                                </div>
                                            )}

                                                <button onClick={() => openEditPractice(set)} className="text-xs font-mono px-3 py-1.5 rounded-lg bg-neutral-800 hover:bg-neutral-700">Edit</button>
                                                <button onClick={() => deletePractice(set.id)} className="text-xs font-mono px-3 py-1.5 rounded-lg bg-neutral-950 text-neutral-500 hover:text-white">Delete</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'timer' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div className="md:col-span-2 p-8 rounded-3xl bg-neutral-900/30 border border-neutral-800/80 text-center space-y-6 backdrop-blur-md editorial-card">
                                    <h2 className="text-xl font-black uppercase tracking-tight">Active Focus Session</h2>
                                    <div className="flex justify-center gap-2">
                                        {['Breezy Glance', 'Hardcore Grind'].map(mode => (
                                            <button
                                                key={mode}
                                                onClick={() => {
                                                    setStudyMode(mode);
                                                    changeTimerDuration(mode === 'Breezy Glance' ? 25 : 50);
                                                }}
                                                className={`px-3 py-1.5 rounded-xl text-xs font-mono font-semibold transition ${studyMode === mode ? 'bg-white text-black font-bold' : 'bg-neutral-800 text-neutral-400'}`}
                                            >
                                                {mode} ({mode === 'Breezy Glance' ? '25m' : '50m'})
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex items-center justify-center gap-3">
                                        <input 
                                            type="text" 
                                            placeholder="Subject Tag (e.g. Physics)" 
                                            value={timerSubject} 
                                            onChange={(e) => setTimerSubject(e.target.value)} 
                                            className="bg-neutral-950 border border-neutral-800 text-center rounded-xl px-3 py-1.5 text-xs font-mono text-white focus:outline-none focus:border-white"
                                        />
                                        <div className="flex items-center gap-1">
                                            <label className="text-xs font-mono text-neutral-400">Custom Mins:</label>
                                            <input 
                                                type="number" 
                                                value={timerMinutes} 
                                                onChange={(e) => changeTimerDuration(Math.max(1, parseInt(e.target.value) || 25))} 
                                                className="w-16 bg-neutral-950 border border-neutral-800 text-center rounded-xl p-1 text-xs font-mono text-white focus:outline-none focus:border-white" 
                                            />
                                        </div>
                                    </div>
                                    <div className="text-6xl md:text-7xl font-mono font-black tracking-widest py-6">
                                        {Math.floor(timeLeft / 60).toString().padStart(2, '0')}:{(timeLeft % 60).toString().padStart(2, '0')}
                                    </div>
                                    <div className="flex justify-center gap-3">
                                        <button
                                            onClick={() => setTimerActive(!timerActive)}
                                            className="px-6 py-3 rounded-xl bg-white text-black font-bold text-sm hover:bg-neutral-200 transition active:scale-95"
                                        >
                                            {timerActive ? 'Pause Session' : 'Start Focus'}
                                        </button>
                                        <button
                                            onClick={completeFocusSession}
                                            className="px-5 py-3 rounded-xl bg-neutral-800 text-neutral-200 font-bold text-sm hover:bg-neutral-700 transition"
                                        >
                                            Complete & Log
                                        </button>
                                    </div>
                                </div>

                                <div className="p-6 rounded-3xl bg-neutral-900/30 border border-neutral-800/80 space-y-4 editorial-card">
                                    <h3 className="text-lg font-black uppercase tracking-tight">Recorded Sessions</h3>
                                    <div className="text-xs font-mono text-neutral-400">Total Hours: <span className="text-white font-bold">{totalFocusHours} hrs</span></div>
                                    <div className="space-y-3 max-h-[300px] overflow-y-auto custom-scrollbar">
                                        {focusLogs.map(log => (
                                            <div key={log.id} className="p-3.5 rounded-2xl bg-neutral-950/80 border border-neutral-800/80 flex justify-between items-center">
                                                <div>
                                                    <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-neutral-800 text-neutral-300 font-semibold">{log.subject}</span>
                                                    <div className="text-xs font-bold mt-1">{log.mode}</div>
                                                    <div className="text-[10px] text-neutral-500 font-mono mt-0.5">{formatDate(log.date)}</div>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <span className="text-xs font-mono px-3 py-1 bg-white text-black rounded-lg font-black">{log.durationMin}m</span>
                                                    <button onClick={() => openEditLog(log)} className="text-[10px] font-mono px-2 py-1 rounded bg-neutral-800 text-neutral-300">Edit</button>
                                                    <button onClick={() => deleteLog(log.id)} className="text-[10px] font-mono px-2 py-1 rounded bg-neutral-950 text-neutral-500 hover:text-white">×</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'calendar' && (
                            <div className="space-y-8">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-black uppercase tracking-tight">Calendar & Exams</h2>
                                    <button onClick={() => setShowExamModal(true)} className="bg-white text-black font-bold px-4 py-2 rounded-xl text-sm">+ Add Exam</button>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-3">
                                    {calendarDays.map((day, idx) => (
                                        <div key={idx} className={`p-4 rounded-2xl border min-h-[120px] flex flex-col justify-between transition ${day.isToday ? 'bg-neutral-900 border-white/60' : 'bg-neutral-950/50 border-neutral-800/80'}`}>
                                            <div>
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="text-[10px] font-mono uppercase text-neutral-500 font-bold">{day.dayName}</span>
                                                    <span className={`text-xs font-mono font-black px-1.5 py-0.5 rounded ${day.isToday ? 'bg-white text-black' : 'text-neutral-300'}`}>{day.dayNum}</span>
                                                </div>
                                                {day.topics.map(t => (
                                                    <div key={t.id} onClick={() => openEditTopic(t)} className="text-[10px] bg-neutral-900 border border-neutral-800 p-1.5 rounded-lg mb-1 truncate font-medium text-neutral-200 cursor-pointer hover:border-white/50">
                                                        📖 {t.title}
                                                    </div>
                                                ))}
                                                {day.exams.map(e => (
                                                    <div key={e.id} onClick={() => openEditExam(e)} className="text-[10px] bg-amber-950/80 border border-amber-800 p-1.5 rounded-lg mb-1 truncate font-bold text-amber-300 cursor-pointer hover:border-amber-400">
                                                        ⚡ {e.title}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Modals for Create & Edit */}
                    {showTopicModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <form onSubmit={handleAddTopic} className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-lg w-full space-y-4 modal-panel">
                                <h3 className="text-lg font-black uppercase tracking-tight">Log Textbook Chapter</h3>
                                <input type="text" placeholder="Subject (e.g. Physics)" value={newTopic.subject} onChange={e => setNewTopic({...newTopic, subject: e.target.value})} className="field" required />
                                <input type="text" placeholder="Chapter Title" value={newTopic.title} onChange={e => setNewTopic({...newTopic, title: e.target.value})} className="field" required />
                                <div className="grid grid-cols-2 gap-3">
                                    <input type="number" placeholder="Start Page" value={newTopic.startPage} onChange={e => setNewTopic({...newTopic, startPage: e.target.value})} className="field" />
                                    <input type="number" placeholder="End Page" value={newTopic.endPage} onChange={e => setNewTopic({...newTopic, endPage: e.target.value})} className="field" />
                                </div>
                                <input type="date" value={newTopic.targetDate} onChange={e => setNewTopic({...newTopic, targetDate: e.target.value})} className="field" />
                                <textarea placeholder="Notes or Key Concepts" value={newTopic.notes} onChange={e => setNewTopic({...newTopic, notes: e.target.value})} className="field h-24"></textarea>
                                <div className="flex justify-end gap-3 pt-2">
                                    <button type="button" onClick={() => setShowTopicModal(false)} className="px-4 py-2 rounded-xl text-sm font-semibold text-neutral-400 hover:text-white">Cancel</button>
                                    <button type="submit" className="px-5 py-2 rounded-xl text-sm font-bold bg-white text-black hover:bg-neutral-200">Save Chapter</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {showPracticeModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <form onSubmit={handleAddPractice} className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-lg w-full space-y-4 modal-panel">
                                <h3 className="text-lg font-black uppercase tracking-tight">Log Practice Set</h3>
                                <input type="text" placeholder="Subject (e.g. Mathematics)" value={newPractice.subject} onChange={e => setNewPractice({...newPractice, subject: e.target.value})} className="field" required />
                                <input type="text" placeholder="Practice Set Title" value={newPractice.title} onChange={e => setNewPractice({...newPractice, title: e.target.value})} className="field" required />
                                <select value={newPractice.mode} onChange={e => setNewPractice({...newPractice, mode: e.target.value})} className="field">
                                    <option value="Breezy Glance">Breezy Glance</option>
                                    <option value="Hardcore Grind">Hardcore Grind</option>
                                </select>
                                <div className="grid grid-cols-2 gap-3">
                                    <input type="number" placeholder="Total Questions" value={newPractice.totalQ} onChange={e => setNewPractice({...newPractice, totalQ: e.target.value})} className="field" required />
                                    <input type="number" placeholder="Correct Answers" value={newPractice.correctQ} onChange={e => setNewPractice({...newPractice, correctQ: e.target.value})} className="field" required />
                                </div>
                                <textarea placeholder="Mistake Log & Learnings" value={newPractice.mistakes} onChange={e => setNewPractice({...newPractice, mistakes: e.target.value})} className="field h-24"></textarea>
                                <div className="flex justify-end gap-3 pt-2">
                                    <button type="button" onClick={() => setShowPracticeModal(false)} className="px-4 py-2 rounded-xl text-sm font-semibold text-neutral-400 hover:text-white">Cancel</button>
                                    <button type="submit" className="px-5 py-2 rounded-xl text-sm font-bold bg-white text-black hover:bg-neutral-200">Save Set</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {showExamModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <form onSubmit={handleAddExam} className="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-lg w-full space-y-4 modal-panel">
                                <h3 className="text-lg font-black uppercase tracking-tight">Add Exam Deadline</h3>
                                <input type="text" placeholder="Exam Title" value={newExam.title} onChange={e => setNewExam({...newExam, title: e.target.value})} className="field" required />
                                <input type="date" value={newExam.date} onChange={e => setNewExam({...newExam, date: e.target.value})} className="field" required />
                                <input type="text" placeholder="Syllabus Scope (e.g. Chapters 1 to 5)" value={newExam.syllabus} onChange={e => setNewExam({...newExam, syllabus: e.target.value})} className="field" />
                                <div className="flex justify-end gap-3 pt-2">
                                    <button type="button" onClick={() => setShowExamModal(false)} className="px-4 py-2 rounded-xl text-sm font-semibold text-neutral-400 hover:text-white">Cancel</button>
                                    <button type="submit" className="px-5 py-2 rounded-xl text-sm font-bold bg-white text-black hover:bg-neutral-200">Add Exam</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {editingTopic && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
                            <form onSubmit={saveEditedTopic} className="modal-panel border rounded-3xl p-6 max-w-lg w-full space-y-4">
                                <div className="flex justify-between items-center"><h3 className="text-xl font-black">Edit Chapter</h3><button type="button" onClick={()=>setEditingTopic(null)} className="text-neutral-500 text-xl">×</button></div>
                                <div className="grid grid-cols-2 gap-3">
                                    <input value={editingTopic.subject||''} onChange={e=>setEditingTopic({...editingTopic,subject:e.target.value})} placeholder="Subject" className="field"/>
                                    <input value={editingTopic.title||''} onChange={e=>setEditingTopic({...editingTopic,title:e.target.value})} placeholder="Chapter title" className="field"/>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <input type="number" value={editingTopic.startPage||''} onChange={e=>setEditingTopic({...editingTopic,startPage:e.target.value})} placeholder="Start page" className="field"/>
                                    <input type="number" value={editingTopic.endPage||''} onChange={e=>setEditingTopic({...editingTopic,endPage:e.target.value})} placeholder="End page" className="field"/>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <input type="date" value={editingTopic.targetDate||''} onChange={e=>setEditingTopic({...editingTopic,targetDate:e.target.value})} className="field"/>
                                    <input type="date" value={editingTopic.nextReview||''} onChange={e=>setEditingTopic({...editingTopic,nextReview:e.target.value})} className="field"/>
                                </div>
                                <textarea value={editingTopic.notes||''} onChange={e=>setEditingTopic({...editingTopic,notes:e.target.value})} placeholder="Notes" className="field h-24"></textarea>
                                <div className="flex justify-end gap-2"><button type="button" onClick={()=>setEditingTopic(null)} className="px-4 py-2 text-sm text-neutral-500">Cancel</button><button className="px-5 py-2 rounded-xl bg-white text-black font-bold text-sm">Save Changes</button></div>
                            </form>
                        </div>
                    )}

                    {editingPractice && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
                            <form onSubmit={saveEditedPractice} className="modal-panel border rounded-3xl p-6 max-w-lg w-full space-y-4">
                                <div className="flex justify-between items-center"><h3 className="text-xl font-black">Edit Practice Set</h3><button type="button" onClick={()=>setEditingPractice(null)} className="text-neutral-500 text-xl">×</button></div>
                                <input value={editingPractice.subject||''} onChange={e=>setEditingPractice({...editingPractice,subject:e.target.value})} placeholder="Subject" className="field"/>
                                <input value={editingPractice.title||''} onChange={e=>setEditingPractice({...editingPractice,title:e.target.value})} placeholder="Title" className="field"/>
                                <div className="grid grid-cols-2 gap-3">
                                    <input type="number" value={editingPractice.totalQ||''} onChange={e=>setEditingPractice({...editingPractice,totalQ:e.target.value})} placeholder="Total questions" className="field"/>
                                    <input type="number" value={editingPractice.correctQ||''} onChange={e=>setEditingPractice({...editingPractice,correctQ:e.target.value})} placeholder="Correct" className="field"/>
                                </div>
                                <textarea value={editingPractice.mistakes||''} onChange={e=>setEditingPractice({...editingPractice,mistakes:e.target.value})} placeholder="Mistakes / learnings" className="field h-24"></textarea>
                                <div className="flex justify-end gap-2"><button type="button" onClick={()=>setEditingPractice(null)} className="px-4 py-2 text-sm text-neutral-500">Cancel</button><button className="px-5 py-2 rounded-xl bg-white text-black font-bold text-sm">Save Changes</button></div>
                            </form>
                        </div>
                    )}

                    {editingExam && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
                            <form onSubmit={saveEditedExam} className="modal-panel border rounded-3xl p-6 max-w-lg w-full space-y-4">
                                <div className="flex justify-between items-center"><h3 className="text-xl font-black">Edit Exam</h3><button type="button" onClick={()=>setEditingExam(null)} className="text-neutral-500 text-xl">×</button></div>
                                <input value={editingExam.title||''} onChange={e=>setEditingExam({...editingExam,title:e.target.value})} placeholder="Exam title" className="field"/>
                                <input type="date" value={editingExam.date||''} onChange={e=>setEditingExam({...editingExam,date:e.target.value})} className="field"/>
                                <input value={editingExam.syllabus||''} onChange={e=>setEditingExam({...editingExam,syllabus:e.target.value})} placeholder="Syllabus" className="field"/>
                                <div className="flex justify-end gap-2"><button type="button" onClick={()=>setEditingExam(null)} className="px-4 py-2 text-sm text-neutral-500">Cancel</button><button className="px-5 py-2 rounded-xl bg-white text-black font-bold text-sm">Save Changes</button></div>
                            </form>
                        </div>
                    )}

                    {editingLog && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
                            <form onSubmit={saveEditedLog} className="modal-panel border rounded-3xl p-6 max-w-md w-full space-y-4">
                                <div className="flex justify-between items-center"><h3 className="text-xl font-black">Edit Focus Log</h3><button type="button" onClick={()=>setEditingLog(null)} className="text-neutral-500 text-xl">×</button></div>
                                <input value={editingLog.subject||''} onChange={e=>setEditingLog({...editingLog,subject:e.target.value})} placeholder="Subject" className="field"/>
                                <input type="number" min="1" value={editingLog.durationMin||1} onChange={e=>setEditingLog({...editingLog,durationMin:Number(e.target.value)})} placeholder="Minutes" className="field"/>
                                <div className="flex justify-end gap-2"><button type="button" onClick={()=>setEditingLog(null)} className="px-4 py-2 text-sm text-neutral-500">Cancel</button><button className="px-5 py-2 rounded-xl bg-white text-black font-bold text-sm">Save Changes</button></div>
                            </form>
                        </div>
                    )}

                    {toast && <div className="toast show">{toast}</div>}
                </div>
            );
        }

        ReactDOM.render(<AbiiApp />, document.getElementById('root'));
    </script>
</body>
</html>

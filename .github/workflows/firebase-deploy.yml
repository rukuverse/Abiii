name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main # Change to master if your branch is named master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Static Site to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project abiii-110308
        env:
          FIREBASE_TOKEN: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

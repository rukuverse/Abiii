name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-key.json
    steps:
      - uses: actions/checkout@v4
      - name: Write key file
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Which account is this?
        run: jq -r '"project_id: " + .project_id, "client_email: " + .client_email' "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Deploy
        run: npx --yes firebase-tools@latest deploy --only hosting --project abiii-110308 --non-interactive

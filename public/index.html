/* Abiii editorial typography refresh — typography only */
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;
  letter-spacing:0;
}

/* Large editorial display type */
h1,h2{

  font-weight:400;
  letter-spacing:0;
}
h1{

  line-height:.92;
}
h2{
  font-size:clamp(30px,6vw,44px);

}

  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:0;
}

.gr p{font-size:14px;line-height:1.5}

  font-size:clamp(26px,4vw,34px);
  font-weight:400;
  line-height:1.12;
  letter-spacing:0;
  word-spacing:0;

.clk{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:750;
  letter-spacing:-.04em;
}
.num{font-weight:800;letter-spacing:-.03em}

<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),iso=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const dd=a=>Math.round((new Date(a+'T00:00:00')-new Date(iso()+'T00:00:00'))/864e5);
const fmt=a=>a?new Date(a+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):'—';
// Storage keys are unchanged from the original app
const K={topics:'abiii_topics',practiceSets:'abiii_practice',exams:'abiii_exams',focusLogs:'abiii_focus_logs'},KS='abiii_settings',KP='abiii_prev_backup';
const load=(k,d)=>{let r;try{r=localStorage.getItem(k);if(r==null)return d;const v=JSON.parse(r);if(v===null||Array.isArray(d)!==Array.isArray(v))throw 0;return Array.isArray(d)?v.filter(x=>x&&typeof x==='object'):{...d,...v}}catch(e){try{localStorage.setItem(k+'_corrupt',r)}catch(_){}return d}};
const S={tab:'home',q:'',topics:load(K.topics,[]),practiceSets:load(K.practiceSets,[]),exams:load(K.exams,[]),focusLogs:load(K.focusLogs,[]),set:load(KS,{goal:120,breaks:false,mascot:true})};
const sigs={};
function sigsInit(){for(const k in K)S[k].forEach(o=>{sigs[k+o.id]=JSON.stringify({...o,u:0})})}
function stamp(){let c=0;for(const k in K)S[k].forEach(o=>{const j=JSON.stringify({...o,u:0}),g=k+o.id;if(sigs[g]!==j){if(sigs[g]!==undefined||!o.u){o.u=Date.now();c++}sigs[g]=j}});return c}
const save=()=>{const ch=stamp();try{for(const k in K)localStorage.setItem(K[k],JSON.stringify(S[k]));localStorage.setItem(KS,JSON.stringify(S.set))}catch(e){toast('Storage full — export a backup')}if(ch)ySched()};
const mut=m=>{save();render();toast(m)};
// ---- Cloud sync (Firebase Auth + Realtime Database over REST; no SDK). Paste your keys here or enter them in the app once. ----
const FB={apiKey:'AIzaSyD_Rnmb5PVOb9OYm4ND27x7g5rpLrAMC_E',url:'https://abiii-110308-default-rtdb.asia-southeast1.firebasedatabase.app/'};
let Y=(()=>{try{return JSON.parse(localStorage.getItem('abiii_sync'))||{}}catch(e){return{}}})(),yBusy=0,yT=0;
const ySv=()=>{try{localStorage.setItem('abiii_sync',JSON.stringify(Y))}catch(e){}};
const fbk=()=>FB.apiKey||S.set.fbKey||'',fbu=()=>String(FB.url||S.set.fbUrl||'').replace(/\/+$/,'');
const ks=id=>String(id).replace(/[.#$\[\]\/]/g,'_'),rk=(k,id)=>k+'/i'+ks(id),dk=(k,id)=>k+'_i'+ks(id);
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' h ago'};
const yErr=m=>({EMAIL_EXISTS:'That email already has an account. Sign in instead.',INVALID_LOGIN_CREDENTIALS:'Wrong email or password.',INVALID_PASSWORD:'Wrong email or password.',EMAIL_NOT_FOUND:'No account with that email.',WEAK_PASSWORD:'Password needs 6+ characters.',INVALID_EMAIL:'That email looks wrong.',OPERATION_NOT_ALLOWED:'Enable Email/Password sign-in in Firebase.',TOO_MANY_ATTEMPTS_TRY_LATER:'Too many tries. Wait a bit.'}[String(m).split(' ')[0]]||String(m));
const ySt=()=>Y.uid?'Cloud sync on · '+esc(Y.email)+(Y.last?' · synced '+ago(Y.last):'')+'.':'Stored on this device. Create an account under Cloud sync to back it up and use it on other devices.';
function ySched(){if(!Y.uid)return;clearTimeout(yT);yT=setTimeout(()=>ySync(0),4000)}
async function yAuth(mode,email,pw){const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+mode+'?key='+fbk(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw,returnSecureToken:true})}),d=await r.json();if(!r.ok)throw new Error(d.error&&d.error.message||'Sign-in failed');return{uid:d.localId,email:d.email,rt:d.refreshToken,it:d.idToken,ex:Date.now()+(+d.expiresIn-60)*1e3}}
async function yTok(){if(!Y.uid)throw new Error('Not signed in');if(Date.now()<Y.ex)return Y.it;const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+fbk(),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(Y.rt)}),d=await r.json();if(!r.ok)throw new Error('Session expired. Sign in again.');Y.it=d.id_token;Y.rt=d.refresh_token;Y.ex=Date.now()+(+d.expires_in-60)*1e3;ySv();return Y.it}
async function ySync(manual){
 if(!Y.uid||yBusy||!fbu())return;
 if(navigator.onLine===false){if(manual)toast('Offline. Will sync when you are back online');return}
 yBusy=1;
 try{
  const tk=await yTok(),base=fbu()+'/users/'+Y.uid,q='.json?auth='+encodeURIComponent(tk),r=await fetch(base+q);
  if(!r.ok)throw new Error(r.status==401||r.status==403?'Cloud access denied. Check the database rules.':'Cloud read failed ('+r.status+')');
  const rem=(await r.json())||{},dead={};
  (S.set.dead||[]).forEach(x=>{const g=dk(x.k,x.id);dead[g]=Math.max(dead[g]||0,+x.t||0)});
  Object.entries(rem.dead||{}).forEach(([g,t])=>{dead[g]=Math.max(dead[g]||0,+t||0)});
  const up={},next={};let changed=0;
  for(const k in K){
   const L=new Map(S[k].map(o=>[o.id,o])),R=new Map(Object.values(rem[k]||{}).filter(o=>o&&typeof o==='object'&&Number(o.id)).map(o=>[Number(o.id),{...o,id:Number(o.id)}])),out=[];
   new Set([...L.keys(),...R.keys()]).forEach(id=>{
    const l=L.get(id),m=R.get(id),t=dead[dk(k,id)]||0,lu=l?+l.u||0:-1,mu=m?+m.u||0:-1;
    if(t&&t>=Math.max(lu,mu)){if(m)up[rk(k,id)]=null;if(l)changed++;return}
    if(l&&(!m||lu>mu)){out.push(l);up[rk(k,id)]=l}
    else if(m&&(!l||mu>lu)){out.push(m);changed++}
    else out.push(l)});
   next[k]=out}
  Object.entries(dead).forEach(([g,t])=>{if(!(rem.dead&&+rem.dead[g]>=t))up['dead/'+g]=t});
  S.set.dead=Object.entries(dead).map(([g,t])=>{const i=g.indexOf('_i');return{k:g.slice(0,i),id:Number(g.slice(i+2)),t}}).filter(x=>Date.now()-x.t<9e9).slice(-400);
  if(changed){try{localStorage.setItem(KP,JSON.stringify({...Object.fromEntries(Object.keys(K).map(c=>[c,S[c]])),set:S.set}))}catch(e){}for(const k in K)S[k]=next[k];sigsInit()}
  if(Object.keys(up).length){const w=await fetch(base+q,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(up)});if(!w.ok)throw new Error('Cloud write failed ('+w.status+')')}
  Y.last=Date.now();Y.err='';ySv();S.set.owner=Y.uid;save();
  if(changed||manual)render();
  if(manual||changed)toast(changed?'Synced · updated from cloud':'Synced')
 }catch(e){Y.err=String(e.message||e);ySv();if(manual)toast(yErr(Y.err))}
 finally{yBusy=0}}
function cloudCfg(){open(`<h3>Cloud sync setup</h3><p class="mono" style="margin:10px 0">One-time: paste your Firebase Web API key and Realtime Database URL.</p><label class="fl"><span class="mono">API key</span><input id="fk" autocomplete="off"></label><label class="fl"><span class="mono">Database URL</span><input id="fu" placeholder="https://xxxx-default-rtdb.firebaseio.com" autocomplete="off"></label><div class="fa"><button class="btn" data-act="close">Cancel</button><button class="btn p" data-act="ycfg">Save</button></div>`)}
function cloudIn(){open(`<h3>Cloud sync</h3><p class="mono" style="margin:10px 0">Your own account keeps your study data separate from anyone else's.</p><label class="fl"><span class="mono">Email</span><input id="ye" type="email" autocomplete="email"></label><label class="fl"><span class="mono">Password (6+ characters)</span><input id="yp" type="password" autocomplete="current-password"></label><div class="fa" style="flex-wrap:wrap"><button class="btn" data-act="yreset">Forgot password</button><button class="btn" data-act="yin" data-v="signUp">Create account</button><button class="btn p" data-act="yin" data-v="signInWithPassword">Sign in</button></div>`)}
function cloudInfo(){open(`<h3>Cloud sync</h3><p style="margin:10px 0">Signed in as <b>${esc(Y.email)}</b>.</p><p class="mono">${Y.last?'Last sync '+ago(Y.last):'Not synced yet'}${Y.err?' · '+esc(Y.err):''}</p><div class="fa" style="flex-wrap:wrap"><button class="btn" data-act="close">Close</button><button class="btn" data-act="yout">Sign out</button><button class="btn p" data-act="ynow">Sync now</button></div>`)}
sigsInit();
function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2300)}
const I={home:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',rev:'<path d="M20 12a8 8 0 11-3-6.2M20 4v4h-4"/>',book:'<path d="M5 4h10a3 3 0 013 3v13H8a3 3 0 01-3-3zM5 17a3 3 0 013-3h10"/>',pra:'<path d="M4 12l5 5L20 6"/>',foc:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',cal:'<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square">${I[n]}</svg>`;
const mins=d=>S.focusLogs.filter(l=>l.date===d).reduce((a,l)=>a+(+l.durationMin||0),0);
const acc=a=>{const t=a.reduce((s,x)=>s+(+x.totalQ||0),0),c=a.reduce((s,x)=>s+(+x.correctQ||0),0);return t?Math.round(c/t*100):null};
const by=(a,v)=>{const m={};a.forEach(x=>{const k=x.subject||'General';m[k]=(m[k]||0)+v(x)});return Object.entries(m).sort((x,y)=>y[1]-x[1])};
const subjects=()=>[...new Set([...S.topics,...S.focusLogs,...S.practiceSets].map(x=>x.subject).filter(Boolean))];
const match=(o,ks)=>!S.q.trim()||ks.map(k=>o[k]||'').join(' ').toLowerCase().includes(S.q.trim().toLowerCase());
const head=(m,t,b)=>`<div class="ph"><div><div class="mono" style="margin-bottom:12px">${m}</div><h1>${t}</h1></div>${b||''}</div>`;
const sec=(t,n)=>`<div class="sh"><h2>${t}</h2><span class="mono">${n}</span></div>`;
const empty=(t,p,b)=>`<div class="em"><h3>${t}</h3><p>${p}</p>${b||''}</div>`;
const search=()=>`<div class="sb"><span class="mono">/</span><input id="q" value="${esc(S.q)}" placeholder="Search" autocomplete="off"></div>`;
const edel=(e,id)=>`<button class="ln" data-act="edit${e}" data-id="${id}">Edit</button><button class="ln" data-act="del${e}" data-id="${id}">Delete</button>`;
const dueLbl=t=>{const n=dd(t.nextReview||plus(0));return n<0?`<b class="rd">${-n}d overdue</b>`:n==0?'<b class="bl">Due today</b>':`due in ${n}d`};
const pages=t=>t.startPage?`pp ${esc(t.startPage)}–${esc(t.endPage)} · `:'';

function home(){
 const td=iso(),tm=mins(td),g=+S.set.goal||120,p=Math.min(1,tm/g),ac=acc(S.practiceSets);
 const due=S.topics.filter(t=>t.nextReview&&t.nextReview<=td).length,dn=S.topics.filter(t=>t.status==='Done').length;
 const o=x=>({Reading:0,'Under Revision':1}[x.status]??2);
 const c=S.topics.filter(t=>t.status!=='Done').sort((a,b)=>o(a)-o(b)||(a.targetDate||'9').localeCompare(b.targetDate||'9'))[0];
 const ex=S.exams.filter(e=>e.date&&dd(e.date)>=0).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
 const wk=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return{m:mins(iso(d)),l:d.toLocaleDateString('en-GB',{weekday:'narrow'}),t:i==6}}),mx=Math.max(1,...wk.map(x=>x.m));
 const sd=by(S.focusLogs,l=>+l.durationMin||0),st=sd.reduce((a,x)=>a+x[1],0)||1;
 const pa=[...new Set(S.practiceSets.map(x=>x.subject||'General'))].map(s=>[s,acc(S.practiceSets.filter(x=>(x.subject||'General')===s))]).filter(x=>x[1]!==null);
 return `<div class="ph hero"><div><div class="mono" style="margin-bottom:12px">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div><h1>${tm}<span class="u">/ ${g} min</span></h1><div class="tr" style="margin:14px 0 4px;max-width:320px"><i style="width:${p*100}%"></i></div><button class="ln" data-act="goal">Daily goal — edit</button></div><button class="av home-ab" data-act="mascotTap" aria-label="Tap Abiii for encouragement">${AB('idle',tm>=g,92)}</button></div>
 <div class="st"><div><div class="mono">Due now</div><div class="num ${due?'bl':''}">${due}</div></div><div><div class="mono">Chapters done</div><div class="num">${dn}<small>/${S.topics.length}</small></div></div><div><div class="mono">Accuracy</div><div class="num">${ac==null?'—':ac+'<small>%</small>'}</div></div></div>
 ${sec('Continue studying','01')}${c?`<div class="row"><div class="gr"><div class="mono">${esc(c.subject)} · ${esc(c.status||'Unread')}</div><h3>${esc(c.title)}</h3><div class="mono" style="margin-top:4px">${pages(c)}target ${fmt(c.targetDate)}</div></div><button class="btn b" data-act="cont" data-id="${c.id}">Start focus →</button></div>`:empty('Nothing in progress','Log a textbook chapter to get a study shortcut here.',`<button class="btn p" data-act="addT">+ Chapter</button>`)}
 ${sec('Upcoming exams','02')}${ex.length?ex.map(e=>`<div class="row"><div class="gr"><div class="mono">${fmt(e.date)}</div><h3>${esc(e.title)}</h3><div class="mono" style="margin-top:4px">${esc(e.syllabus||'')}</div></div><div class="num">${dd(e.date)}<small>days</small></div></div>`).join(''):empty('No exams ahead','Add a date to see the countdown.',`<button class="btn p" data-act="addE">+ Exam</button>`)}
 ${sec('Analytics','03')}<div class="cols"><div><div class="mono" style="margin-top:14px">Focus · last 7 days · ${wk.reduce((a,x)=>a+x.m,0)} min</div><div class="wk">${wk.map(x=>`<div class="${x.t?'t':''}"><span class="mono">${x.m||''}</span><i style="height:${Math.max(2,x.m/mx*90)}px"></i><span class="mono">${x.l}</span></div>`).join('')}</div></div>
 <div><div class="mono" style="margin-top:14px">Subject distribution</div>${sd.length?sd.slice(0,5).map(([s,m])=>`<div class="dr"><span>${esc(s)}</span><span class="mono">${m}m · ${Math.round(m/st*100)}%</span></div><div class="tr"><i style="width:${m/st*100}%"></i></div>`).join(''):'<p class="mono" style="margin-top:16px">No sessions yet</p>'}</div></div>
 <div class="cols"><div><div class="mono" style="margin-top:34px">Practice accuracy by subject</div>${pa.length?pa.map(([s,a])=>`<div class="dr"><span>${esc(s)}</span><span class="mono">${a}%</span></div><div class="tr"><i style="width:${a}%"></i></div>`).join(''):'<p class="mono" style="margin-top:16px">No practice yet</p>'}</div>
 <div><div class="mono" style="margin-top:34px">Chapter progress</div><div class="dr"><span>Completed</span><span class="mono">${dn} / ${S.topics.length}</span></div><div class="tr"><i style="width:${S.topics.length?dn/S.topics.length*100:0}%"></i></div><div class="dr"><span>Solid confidence</span><span class="mono">${S.topics.filter(t=>t.confidence==='Solid').length}</span></div></div></div>
 ${sec('Data','04')}<div class="row dat"><div class="gr"><p>${ySt()} Export regularly; imports are validated and your current data is snapshotted first.</p></div><div class="ac"><button class="btn b" data-act="cloud">${Y.uid?'Cloud sync ●':'Cloud sync'}</button><button class="btn" data-act="export">Export</button><button class="btn" data-act="import">Import</button><button class="btn" data-act="mascot">Abiii ${S.set.mascot===false?'off':'on'}</button><button class="btn" data-act="abset">Settings</button><button class="btn" data-act="snaps">Snapshots</button>${localStorage.getItem(KP)?'<button class="btn" data-act="undo">Undo import</button>':''}</div></div>`}

const trow=(t,r)=>`<div class="row"><div class="gr"><div class="mono">${esc(t.subject)} · ${esc(t.status||'Unread')}${t.confidence?` · <span class="${esc(t.confidence)}">${esc(t.confidence)}</span>`:''}</div><h3>${esc(t.title)}</h3><div class="mono" style="margin-top:4px">${pages(t)}${dueLbl(t)}</div>${!r&&t.notes?`<p>${esc(t.notes)}</p>`:''}</div><div class="ac">${r?[['Forgot',1],['Hazy',3],['Solid',IV_S[Math.min(+t.reps||0,3)]]].map(([v,n])=>`<button class="btn" data-act="conf" data-id="${t.id}" data-v="${v}">${v}<em>${n}d</em></button>`).join(''):`<button class="btn" data-act="done" data-id="${t.id}">${t.status==='Done'?'Reopen':'Mark done'}</button>`}${edel('T',t.id)}</div></div>`;
function rev(){
 const l=S.topics.filter(t=>match(t,['subject','title','notes'])).sort((a,b)=>(a.nextReview||'').localeCompare(b.nextReview||'')),n=t=>dd(t.nextReview||plus(0));
 const G=[['Overdue',l.filter(t=>n(t)<0)],['Due today',l.filter(t=>n(t)==0)],['Upcoming',l.filter(t=>n(t)>0)]];
 return head(`${G[0][1].length} overdue · ${G[1][1].length} due today`,'Revise')+(S.topics.length?search()+(l.length?G.map(([t,a])=>a.length?sec(t,a.length)+a.map(x=>trow(x,1)).join(''):'').join(''):empty('No match','Try another search.')):empty('Nothing to revise','Log a chapter and it joins the revision queue.',`<button class="btn p" data-act="addT">+ Chapter</button>`))}
function lib(){
 const l=S.topics.filter(t=>match(t,['subject','title','notes'])&&(!S.sf||t.subject===S.sf)),g={};l.forEach(t=>(g[t.subject||'General']=g[t.subject||'General']||[]).push(t));

function doImport(inp){
 const f=inp.files[0];inp.value='';if(!f)return;
 f.text().then(t=>{

  if(!Object.keys(o).length)throw 0;
  const n=k=>o[k]?o[k].length:'kept';
  ask(`Replace current data with ${n('topics')} chapters, ${n('practiceSets')} practice sets, ${n('exams')} exams, ${n('focusLogs')} sessions? Your current data is saved for undo.`,()=>{
   try{localStorage.setItem(KP,JSON.stringify({...Object.fromEntries(Object.keys(K).map(k=>[k,S[k]])),set:S.set}))}catch(e){}
   for(const k in o)S[k]=o[k];

   mut('Backup restored')},'Import')
 }).catch(()=>toast('Invalid backup file — nothing changed'))}
